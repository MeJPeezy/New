<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opening Knowledge Graph…</title>
  <script>
    const target = new URL('viewer.html', location.href);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</head>
<body>
  <p><a id="open" href="viewer.html">Open the knowledge graph</a></p>
  <script>document.getElementById('open').href = 'viewer.html' + location.search + location.hash;</script>
</body>
</html>
