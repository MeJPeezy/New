<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0f1117">
  <title>Knowledge Graph — Live References</title>
  <style>
    :root { color-scheme: dark; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0f1117; color: #eef1f7; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    #app { display: grid; grid-template-rows: auto minmax(0,1fr) auto; height: 100dvh; }
    header { padding: calc(10px + var(--safe-top)) 12px 9px; border-bottom: 1px solid #272b37; background: #151821; }
    h1 { margin: 0; font-size: 14px; }
    #status { margin-top: 4px; color: #9ca4b8; font-size: 11px; }
    #toolbar { display: grid; grid-template-columns: minmax(0,1fr) auto auto auto; gap: 6px; margin-top: 8px; }
    input, button { min-height: 40px; border: 1px solid #303647; border-radius: 8px; background: #0f1117; color: #eef1f7; padding: 8px 10px; font: inherit; touch-action: manipulation; }
    input { min-width: 0; width: 100%; }
    button { cursor: pointer; white-space: nowrap; }
    button:active { background: #242938; transform: translateY(1px); }
    #stage { position: relative; min-height: 0; touch-action: none; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #details { min-height: 88px; max-height: 28dvh; overflow: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px calc(10px + var(--safe-bottom)); border-top: 1px solid #272b37; background: #151821; font-size: 12px; line-height: 1.45; }
    .muted { color: #8f98ac; }
    .pill { display: inline-block; margin: 4px 4px 0 0; padding: 3px 7px; border-radius: 999px; background: #282e3d; color: #cbd2e3; }
    #linkbox { margin-top: 8px; word-break: break-all; font-size: 11px; }
    @media (max-width: 480px) {
      #toolbar { grid-template-columns: minmax(0,1fr) auto auto; }
      #share { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>🧠 Knowledge Graph</h1>
      <div id="status">Loading graph…</div>
      <div id="toolbar">
        <input id="search" type="search" placeholder="Node ID or label…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="fit" type="button">Fit</button>
        <button id="clear" type="button">Clear</button>
        <button id="share" type="button">Copy link</button>
      </div>
    </header>
    <div id="stage"><canvas id="graph"></canvas></div>
    <div id="details"><span class="muted">Open a graph link from a ChatGPT answer or search for a node. Drag to pan; pinch to zoom.</span></div>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
