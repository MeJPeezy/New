<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Graphify Live References</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f1117; color: #eef1f7; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
    header { padding: 12px 14px 10px; border-bottom: 1px solid #272b37; background: #151821; }
    h1 { margin: 0; font-size: 14px; }
    #status { margin-top: 5px; color: #9ca4b8; font-size: 11px; }
    #toolbar { display: flex; gap: 7px; margin-top: 9px; }
    input, button { border: 1px solid #303647; border-radius: 7px; background: #0f1117; color: #eef1f7; padding: 7px 9px; font: inherit; }
    input { min-width: 0; flex: 1; }
    button { cursor: pointer; }
    button:hover { background: #242938; }
    #stage { position: relative; min-height: 0; }
    canvas { width: 100%; height: 100%; display: block; }
    #details { min-height: 82px; max-height: 180px; overflow: auto; padding: 10px 13px; border-top: 1px solid #272b37; background: #151821; font-size: 12px; line-height: 1.45; }
    .muted { color: #8f98ac; }
    .pill { display: inline-block; margin: 4px 4px 0 0; padding: 2px 6px; border-radius: 999px; background: #282e3d; color: #cbd2e3; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>🧠 Graphify Live References</h1>
      <div id="status">Loading graph…</div>
      <div id="toolbar">
        <input id="search" type="search" placeholder="Find a node…" autocomplete="off">
        <button id="fit" type="button">Fit</button>
        <button id="clear" type="button">Clear</button>
      </div>
    </header>
    <div id="stage"><canvas id="graph"></canvas></div>
    <div id="details"><span class="muted">Referenced nodes from the latest answer will highlight automatically.</span></div>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
